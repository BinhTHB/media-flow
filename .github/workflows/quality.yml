name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MEDIA_FLOW_RUN_YOLO_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q src tests scripts/quality.py scripts/secret_scan.py
      - name: Architecture boundaries
        run: python -m pytest -q tests/test_architecture_boundaries.py
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Full offline test suite
        run: python -m pytest -q
