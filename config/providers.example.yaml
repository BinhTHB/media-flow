defaults:
  ocr: gemini_vision
  speech: gemini_audio
  translation: gemini

provider_fallback:
  ocr_fallback_provider: paddle
  speech_fallback_provider: faster-whisper
  ocr_fallback_enabled: true
  speech_fallback_enabled: true

providers:
  ocr:
    gemini_vision:
      model: gemini-3.5-flash-lite
    gemini_video_direct:
      model: gemini-3.5-flash-lite
      direct_video_discovery_fps: 6
      direct_video_classification_fps: 6
      direct_video_segmentation_fps: 12
      direct_video_geometry_fps: 12
      direct_video_transcription_fps: 12
      direct_video_media_resolution: high
      direct_video_clip_padding_seconds: 0.40
      direct_video_max_retry_per_stage: 1
      direct_video_max_raw_candidates: 200
      direct_video_max_parseable_raw_candidates: 200
      direct_video_batch_size: 10
      direct_video_max_quota_wait_seconds: 120
      direct_video_max_quota_retries_per_stage: 1
      direct_video_resume_enabled: true
    paddle:
      language: ch
      use_gpu: true
  speech:
    gemini_audio:
      model: gemini-3.5-flash-lite
    faster-whisper:
      model_size: base
      device: cpu
      compute_type: int8
  translation:
    gemini:
      model: gemini-3.5-flash-lite
