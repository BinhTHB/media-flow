# YOLO burn-in detector configuration.
# Resolved model priority: MEDIA_FLOW_YOLO_WEIGHTS env > `weights` here > default.
# Low subtitle threshold helps capture subtitles that appear character-by-
# character or scroll quickly. Low thresholds must be paired with temporal
# stabilization to suppress single-frame false positives.
#
# NOTE: the per-class confidence thresholds below are the current defaults.
# They are re-derived from the ground-truth threshold sweep
# (outputs/evaluation/threshold_sweep.csv + threshold_recommendation.md) once
# the evaluation labels are human-verified. Do not hand-tune them before that.

yolo:
  enabled: true
  weights: models/yolo/best.pt
  device: auto        # auto | cpu | cuda
  imgsz: 1280
  iou: 0.45
  max_det: 100
  half: auto          # FP16 only on CUDA
  agnostic_nms: false
  verbose: false

  # Per-class confidence floor (production detection). subtitle is lower so
  # character-by-character / scrolling subtitles are captured.
  confidence:
    subtitle: 0.15
    watermark: 0.20
    logo: 0.20
    other_burn_in_text: 0.20

  # Class action policy: separates *detection* from *action*.
  #   detect     - emit boxes of this class from the detector
  #   safe_cover - downstream renderer may cover/remove this class
  # Default keeps every class detected AND coverable, matching the legacy
  # pipeline that treated all burn-in regions as coverable text. If a future
  # renderer should not cover watermarks/logos, set their safe_cover to false.
  class_policy:
    subtitle:
      detect: true
      safe_cover: true
    watermark:
      detect: true
      safe_cover: true
    logo:
      detect: true
      safe_cover: true
    other_burn_in_text:
      detect: true
      safe_cover: true

  # Temporal stabilization: carries tracks through 1-2 frame gaps and drops
  # tracks shorter than min_track_frames observations. min_track_frames=2 kills
  # most one-frame false positives but can drop very short subtitle flashes;
  # the trade-off is measured by the temporal evaluation once GT is verified.
  temporal:
    enabled: true
    max_gap_frames: 2
    min_track_frames: 2
    iou_match_threshold: 0.40
    box_smoothing_alpha: 0.65

# batch size is a benchmark/runtime concern (scripts/run_detection_benchmark.py
# --batch), not part of this config file.
